# Render Blueprint (free plan): one web service serving both the API and the built React app.
# Free instances have no persistent disk, so the SQLite database lives in /tmp and
# resets to the original demo data whenever the service restarts or wakes from sleep.
services:
  - type: web
    name: peakage-smart-assign
    runtime: python
    plan: free
    region: singapore
    buildCommand: ./build.sh
    startCommand: cd backend && uvicorn app.main:app_factory --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: NODE_VERSION
        value: 22.22.2
      - key: ROUTING_MODE
        value: demo # change to "live" after adding OLA_MAPS_API_KEY
      - key: OLA_MAPS_API_KEY
        sync: false # entered in the Render dashboard, never committed
      - key: DATABASE_URL
        value: sqlite:////tmp/smart_assign.db
      - key: STATIC_DIR
        value: static
      - key: APP_ACCESS_TOKEN
        generateValue: true # shared passcode, visible in the service's Environment tab
